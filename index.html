<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlayK × La Bergerie — Réunion Kick‑off (présentation interactive)</title>
  <meta name="description" content="Deck interactif pour cadrer le projet PlayK × La Bergerie : vision, objectifs, rôles, calendrier et plan d'action."/>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#0f172a;
      --fg:#e5e7eb;
      --muted:#94a3b8;
      --accent:#d4af37;
      --glacier:#8ecae6;
      --wine:#8b183a;
      --ok:#10b981;
      --warn:#f59e0b;
    }
    html,body{height:100%;}
    body{
      margin:0; background:var(--bg);
      color:var(--fg); font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    header{
      position:fixed; inset:0 0 auto 0; height:56px; display:flex; align-items:center; gap:12px; padding:8px 14px; z-index:10;
      background:linear-gradient(to bottom, rgba(11,15,20,.9), rgba(11,15,20,.6)); backdrop-filter: blur(6px);
      border-bottom:1px solid rgba(212,175,55,.15);
      font-size:14px;
    }
    header .brand{display:flex; align-items:center; gap:8px; font-weight:800;}
    header .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 20px rgba(212,175,55,.5)}
    header small{color:var(--muted)}

    .progress{flex:1; height:4px; background:#0b1220; border-radius:999px; overflow:hidden;}
    .progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--glacier));transition:width .35s ease;}

    main{height:100%; display:grid; place-items:center; padding:64px 12px 80px;}
    .deck{width:100%; max-width:1100px; min-height:60vh; background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.00)); border:1px solid rgba(148,163,184,.15); border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); position:relative; overflow:hidden;}
    .slide{position:absolute; inset:0; padding:20px; display:flex; flex-direction:column; gap:14px; opacity:0; transform:translateX(20px) scale(.98); transition:.45s cubic-bezier(.2,.7,.2,1); overflow:auto;}
    .slide.active{opacity:1; transform:none;}
    .h1{font-size: clamp(22px, 5vw, 40px); line-height:1.2; font-weight:900;}
    .h2{font-size: clamp(18px, 3.5vw, 26px); font-weight:800; color:#e7ecef;}
    .pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border:1px solid rgba(212,175,55,.35); color:var(--accent); border-radius:999px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; font-size:11px;}
    .muted{color:var(--muted)}

    .grid{display:grid; gap:12px;}
    .grid.cols-2{grid-template-columns: repeat(auto-fit, minmax(220px,1fr));} 
    .grid.cols-3{grid-template-columns: repeat(auto-fit, minmax(200px,1fr));} 
    .grid.cols-4{grid-template-columns: repeat(auto-fit, minmax(180px,1fr));} 

    .card{background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.00)); border:1px solid rgba(148,163,184,.18); border-radius:16px; padding:14px; box-shadow:0 8px 24px rgba(0,0,0,.25);}
    .card h3{margin:.2rem 0 .4rem; font-size: clamp(15px, 2vw, 18px);}
    .card p{margin:.25rem 0; color:var(--muted)}

    ul.clean{list-style:none; padding-left:0; margin:0}
    ul.clean li{padding:6px 0; display:flex; gap:8px; align-items:flex-start;}
    ul.clean li i{margin-top:4px; width:7px; height:7px; border-radius:2px; background:linear-gradient(90deg,var(--accent),var(--glacier)); flex:0 0 7px; box-shadow:0 0 10px rgba(212,175,55,.5)}

    .timeline{display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(180px,1fr));}
    .timeline .col{background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.00)); border:1px solid rgba(148,163,184,.18); border-radius:12px; padding:10px;}
    .timeline h4{margin:.3rem 0; font-size:14px}

    .task{display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:start; padding:4px 0;}
    .task input[type="checkbox"]{margin-top:3px; width:16px; height:16px}
    .task small{color:var(--muted)}

    .nav{position:fixed; inset:auto 0 10px 0; display:flex; justify-content:center; gap:10px; z-index:20; flex-wrap:wrap;}
    .nav button{background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01)); color:var(--fg); border:1px solid rgba(148,163,184,.2); border-radius:12px; padding:10px 12px; font-weight:700; cursor:pointer; font-size:14px}

    .toolbar{position:absolute; inset:auto 10px 10px auto; display:flex; flex-wrap:wrap; gap:6px}
    .toolbar .chip{background:rgba(255,255,255,.06); border:1px solid rgba(148,163,184,.2); padding:4px 8px; border-radius:999px; color:var(--muted); font-weight:600; font-size:11px}

    .inputs{display:flex; flex-wrap:wrap; gap:8px; margin:.3rem 0 0}
    .inputs input, .inputs select, .inputs button{background:#0b1220; color:var(--fg); border:1px solid rgba(148,163,184,.25); border-radius:8px; padding:6px 8px; font-weight:600; font-size:14px; flex:1; min-width:120px}
    .inputs button{cursor:pointer; flex:unset}

    @media(max-width:640px){
      header{font-size:12px; height:48px}
      .h1{font-size: clamp(18px, 6vw, 28px);}
      main{padding:56px 8px 72px;}
      .deck{border-radius:12px;}
      .slide{padding:16px; gap:10px}
      .card{padding:10px;}
      .card h3{font-size:14px}
      .nav button{padding:8px 10px; font-size:13px}
    }

    @media print{
      header,.nav,.toolbar{display:none !important}
      body{background:#fff; color:#111}
      .deck{width:100%; box-shadow:none; border:none;}
      .slide{position:relative; opacity:1; transform:none; page-break-after:always}
    }
  </style>
</head>
<body>
  <!-- Le reste du code HTML (slides, scripts, etc.) reste inchangé -->
</body>
</html>
